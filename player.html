<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap 5.1.3 -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <title>REALM ONE - ALMIGHTY ODOT! (MENOCLONE)</title>

  <style>
    :root {
      --neon-pink: #ff2bdc;
      --neon-cyan: #00f6ff;
      --acid-green: #b6ff00;
      --deep-black: #050507;
      --panel-black: #0d0f14;
    }

    body {
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02),
          rgba(255,255,255,0.02) 1px,
          transparent 1px,
          transparent 3px
        ),
        radial-gradient(circle at top, #111827, #000 70%);
      color: var(--neon-cyan);
      font-family: "Press Start 2P", monospace;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    /* subtle vignette + glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.75) 100%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;

      background: var(--panel-black);
      border: 3px solid var(--neon-pink);
      box-shadow:
        0 0 20px var(--neon-pink),
        inset 0 0 15px rgba(255, 43, 220, 0.3);
      padding: 30px 22px;
      max-width: 460px;
      border-radius: 12px;
    }

    /* top label */
    .container::before {
      content: "REALM // ONE";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      padding: 0 10px;
      font-size: 10px;
      color: var(--acid-green);
      letter-spacing: 2px;
      border-left: 3px solid var(--neon-cyan);
      border-right: 3px solid var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 246, 255, 0.5);
    }

    /* cyber corner accents */
    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 246, 255, 0.5);
    }
    .corner.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
    .corner.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
    .corner.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
    .corner.br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

    #main-image {
      max-width: 260px;
      width: 100%;
      border: 4px solid var(--neon-cyan);
      box-shadow:
        0 0 25px var(--neon-cyan),
        inset 0 0 10px rgba(0, 246, 255, 0.4);
      border-radius: 8px;
      margin: 6px auto 18px auto;
      display: block;
    }

    #artist-name {
      color: var(--neon-pink);
      text-shadow:
        0 0 6px var(--neon-pink),
        0 0 12px rgba(255, 43, 220, 0.6);
      margin-bottom: 14px;
      font-size: 12px;
      line-height: 1.4;
    }

    p {
      font-size: 9px;
      color: #c7f9ff;
      line-height: 1.7;
      text-shadow: 0 0 4px rgba(0, 246, 255, 0.35);
      margin-bottom: 10px;
    }

    .divider {
      height: 2px;
      margin: 14px 0 18px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent);
      box-shadow: 0 0 12px rgba(0, 246, 255, 0.35);
    }

    /* Button */
    .cyber-btn {
      margin-top: 10px;
      width: 100%;
      max-width: 320px;

      background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
      border: none;
      color: #000;

      padding: 14px 16px;
      font-size: 10px;
      font-family: "Press Start 2P", monospace;
      letter-spacing: 1px;

      box-shadow:
        0 0 15px rgba(255, 43, 220, 0.8),
        0 0 30px rgba(0, 246, 255, 0.6);

      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      border-radius: 10px;
      user-select: none;
    }

    .cyber-btn::before,
    .cyber-btn::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      border: 2px dashed rgba(182, 255, 0, 0.55);
      opacity: 0.45;
      pointer-events: none;
    }

    .cyber-btn:hover {
      transform: translateY(-2px);
      filter: saturate(1.2) contrast(1.05);
      box-shadow:
        0 0 22px rgba(0, 246, 255, 0.8),
        0 0 45px rgba(255, 43, 220, 0.75);
    }

    .cyber-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    /* flicker */
    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.86; }
      100% { opacity: 1; }
    }
    .flicker { animation: flicker 1.8s infinite; }

    /* tiny glitch jitter on title */
    @keyframes jitter {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-1px); }
      40% { transform: translateX(1px); }
      60% { transform: translateX(-1px); }
      80% { transform: translateX(1px); }
    }
    .glitchy { animation: jitter 2.6s infinite; }

    /* small helper text */
    .subnote {
      color: rgba(182, 255, 0, 0.85);
      font-size: 8px;
      margin-top: 12px;
      text-shadow: 0 0 8px rgba(182, 255, 0, 0.3);
    }
  </style>
</head>

<body>
  <div class="container">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <img id="main-image" src="ALMIGHTYODOT.png" alt="Artist" class="img-fluid" />

    <h5 id="artist-name" class="glitchy">REALM ONE - ALMIGHTY ODOT!</h5>

    <p>AUDIO IS PROVIDED RANDOMLY TO EXPERIENCE REALM ONE ENTIRETY.</p>
    <div class="divider"></div>
    <p>TO SKIP TO MULTIPLE BEATS, PRESS THE PLAY BUTTON. -ODOT!</p>

    <button
      id="play-button"
      class="cyber-btn mx-auto d-block flicker"
      onclick="loadAndPlayAudio()"
      type="button"
    >
      ▶ PLAY REALM ONE
    </button>

    <p class="subnote">NEON MODE: ACTIVE // RIGHT-CLICK DISABLED</p>

    <audio id="audio"></audio>
  </div>

  <script>
    document.addEventListener("contextmenu", function (e) {
      e.preventDefault(); // Disable right-click
    });

    const audioFiles = [
      "MENOCLONE - Cosmigasm - REALM ONE TAPE - ALMIGHTYODOT.mp3",
      "MENOCLONE - Evolution of Orginyte - REALM ONE TAPE - ALMIGHTYODOT.mp3",
      "MENOCLONE - Floppy Byte 84 - REALM ONE TAPE - ALMIGHTYODOT.mp3",
      "MENOCLONE - Landing Test - REALM ONE TAPE - ALMIGHTYODOT.mp3",
      "MENOCLONE - Style Synth - REALM ONE TAPE - ALMIGHTYODOT.mp3",
      "MENOCLONE - The Landing - REALM ONE TAPE - ALMIGHTYODOT.mp3",
    ];

    function getRandomAudioFile() {
      const randomIndex = Math.floor(Math.random() * audioFiles.length);
      return audioFiles[randomIndex];
    }

    function loadAndPlayAudio() {
      const audioElement = document.getElementById("audio");
      audioElement.src = getRandomAudioFile();

      audioElement.play().catch((error) => {
        console.error("Autoplay was prevented:", error);
      });
    }

    // If you want it to auto-load a random track on page load (without autoplay),
    // you could do:
    // window.onload = () => { document.getElementById("audio").src = getRandomAudioFile(); };

    // Your original code had window.onload = loadAudio; but loadAudio wasn't defined.
    // Leaving page load alone to avoid errors.
  </script>
</body>
</html>
